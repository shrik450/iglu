[package]
name = "iglu-guest"
description = "Tools baked into iglu workspace images"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "iglu-guest"
path = "src/bin/iglu-guest.rs"

[[bin]]
name = "iglu-status"
path = "src/bin/iglu-status.rs"

[[bin]]
name = "caffeinate"
path = "src/bin/caffeinate.rs"

[[bin]]
name = "xclip"
path = "src/bin/xclip.rs"

[[bin]]
name = "xsel"
path = "src/bin/xsel.rs"

[[bin]]
name = "xdg-open"
path = "src/bin/xdg-open.rs"

[dependencies]
iglu-domain.workspace = true
base64 = "0.23.1"
rustix = { version = "1.1.5", features = ["event", "fs", "process", "pty", "termios"] }
signal-hook = "0.3.18"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints]
workspace = true
