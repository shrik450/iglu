[package]
name = "iglu-domain"
description = "iglu's functional core: domain types, parsing, planning and policy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_plain = "1"
thiserror.workspace = true
ts-rs = { version = "12.0.1", default-features = false, optional = true }
uuid.workspace = true

[dev-dependencies]
proptest = "1"
# States each parser's documented grammar independently of its code.
regex = "1"
serde_json.workspace = true
# Resolves return paths as a browser would, to check they stay on the console.
url = "2"

[lints]
workspace = true

[features]
# TypeScript declarations for the types iglud's API exposes; see iglu-api.
ts = ["dep:ts-rs"]
