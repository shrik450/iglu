[package]
name = "iglud"
description = "iglu's control plane: API, console, preview gateway and reconciler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
iglu-domain.workspace = true
iglu-proto.workspace = true
iglu-api.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { workspace = true, features = ["v4"] }
axum = { version = "0.8.9", features = ["ws"] }
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"
sha2 = "0.11.0"
hex = "0.4.3"
base64 = "0.23.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
openidconnect = { version = "4.0.1", default-features = false }
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
http = "1.5.0"
url = { version = "2.5.8", features = ["serde"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
