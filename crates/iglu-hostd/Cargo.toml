[package]
name = "iglu-hostd"
description = "iglu's execution-host daemon: the only process that talks to Incus"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hostd"
path = "src/main.rs"

[dependencies]
iglu-domain.workspace = true
iglu-proto.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
hyper = { version = "1.11.1", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
futures-util = "0.3.34"
sha2 = "0.11.0"
hex = "0.4.3"
percent-encoding = "2.3.2"
tokio-tungstenite = "0.30.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
uuid.workspace = true
tokio-util = { version = "0.7.19", features = ["io"] }
rustix = { version = "1.1.5", features = ["fs"] }

[lints]
workspace = true
