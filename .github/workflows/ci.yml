name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      # Every flake check except the VM test, which is too heavy for hosted
      # runners and runs locally with `just e2e`.
      - name: nix build
        run: |
          mapfile -t checks < <(
            nix eval --json .#checks.x86_64-linux \
              --apply 'checks: builtins.filter (name: name != "e2e") (builtins.attrNames checks)' \
              | jq -r '.[]'
          )
          echo "checks: ${checks[*]}"
          nix build -L --no-link "${checks[@]/#/.#checks.x86_64-linux.}"
