name: CI

on:
  pull_request:
  # A merge queue checks each change on top of the ones ahead of it.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Three jobs, each required to merge: the flake checks, the console checked
# in a browser against the dev stack, and the VM test against a real host.
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: ./.github/actions/nix-cache
        with:
          set: checks
          mode: restore

      # Every flake check except the VM test, which has a job of its own.
      - name: nix build
        run: |
          mapfile -t checks < <(
            nix eval --json .#checks.x86_64-linux \
              --apply 'checks: builtins.filter (name: name != "e2e") (builtins.attrNames checks)' \
              | jq -r '.[]'
          )
          echo "checks: ${checks[*]}"
          nix build -L --no-link "${checks[@]/#/.#checks.x86_64-linux.}"

      - name: Keep what was slow to build for the next run
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nix-cache
        with:
          set: checks
          mode: save

  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: ./.github/actions/nix-cache
        with:
          set: console
          mode: restore

      # Built first, so the stack starts in seconds once it's asked to.
      - name: Build
        run: |
          nix develop -c cargo build -p iglud -p iglu-devhost -p iglu-guest -p iglu-cli
          nix develop -c npm ci --prefix console

      - name: Start the dev stack
        run: |
          nohup nix develop -c just dev > dev-stack.log 2>&1 &
          nix develop -c just dev-wait

      - name: Check the console
        run: nix develop -c just dev-check

      - name: Keep what was slow to build for the next run
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nix-cache
        with:
          set: console
          mode: save

      - name: Keep the dev stack's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dev-stack-logs
          path: |
            dev-stack.log
            .dev/state/logs/

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Hosted runners have KVM, but only root can open it.
      - name: Let builds use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm

      - uses: ./.github/actions/nix-cache
        with:
          set: e2e
          mode: restore

      - name: nix build
        run: nix build -L --no-link .#checks.x86_64-linux.e2e

      - name: Keep what was slow to build for the next run
        if: ${{ !cancelled() }}
        uses: ./.github/actions/nix-cache
        with:
          set: e2e
          mode: save
